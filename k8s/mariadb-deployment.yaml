apiVersion: apps/v1
kind: Deployment
metadata:
  name: mariadb
  namespace: employee-app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: mariadb }
  template:
    metadata:
      labels: { app: mariadb }
    spec:
      containers:
        - name: mariadb
          image: mariadb:11
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mariadb-secret, key: MARIADB_ROOT_PASSWORD } }
            - name: MARIADB_USER
              valueFrom: { secretKeyRef: { name: mariadb-secret, key: DB_USER } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: mariadb-secret, key: DB_PASSWORD } }
            - name: MARIADB_DATABASE
              valueFrom: { configMapKeyRef: { name: app-config, key: DB_NAME } }
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mariadb-pvc }
        - name: init
          configMap: { name: mariadb-init }
