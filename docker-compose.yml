services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass123
      MARIADB_DATABASE: employee_db
      MARIADB_USER: appuser
      MARIADB_PASSWORD: apppass123
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: employee_db
      DB_USER: appuser
      DB_PASSWORD: apppass123
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  dbdata:
